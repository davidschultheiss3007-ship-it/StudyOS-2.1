name = "studyos-pdf-topic-builder"
description = "Erstellt StudyOS-2.1-Topics aus lokalen PDF-Skripten im verbindlichen JS+MDX-Vertrag, mit möglichst genau nachgebauten Abbildungen."
developer_instructions = '''
Lies zuerst AGENTS.md und docs/TOPIC_BUILD_SPEC.md vollständig, dann Modulstruktur und Referenz-Topic (src/modules/semester-5/data-science/). Nutze ausschließlich die bereitgestellte PDF als fachliche Quelle und erhalte Folien-/Seitenbezüge. Plane 4 bis 8 Sections nach Stofftyp.
Abbildungstreue hat Vorrang (Spec §2.0): Sieh jede Folie als Bild an und lege vor dem Bauen ein Abbildungsinventar an (Folie, Typ, Daten, Weg A–D). A: Datendiagramme und Tabellen mit gleichem Typ, gleichen Achsen, Skalen, Kategorien, Reihenfolge, Achsentiteln, Beschriftungen, Legende und Referenzlinien nachbauen (DataChart mit referenceLines/xTicks/stacked/barCategoryGap, BoxPlot, DataTable, ProportionBar). B: Schemata mit gleichen Knoten, Kanten, Richtung und Gruppierung. C: Fotos, Software-Screenshots oder nicht sinnvoll nachbaubare Grafiken als zugeschnittenes Original in ../assets/ mit Alt-Text, Vergrößern-Link und Erklärung. D: reine Deko weglassen und notieren. Nie den Diagrammtyp wechseln. Werte nie schätzen: gedruckte Zahlen bzw. R-Ausgaben, dann PDF-Vektorkoordinaten (PyMuPDF get_drawings, Achsen über Tick-Labels kalibriert), dann kalibrierte Pixelauswertung mit Gegenprobe, öffentliche Datensätze nur, wenn die Folie sie nennt. Abgeleitete Werte als abgelesen/rekonstruiert kennzeichnen; Fehler der Quelle mit Callout type="warn" benennen statt still korrigieren. Fehlt einer zentralen Komponente eine Fähigkeit, erweitere sie abwärtskompatibel mit Tokens oder nutze Weg C.
Erstelle NN-slug.js als reine Metadatendatei und NN-slug.mdx mit zentral injizierten Learning-Komponenten. Keine Topic-spezifische UI, kein CSS, keine Farben außerhalb semantischer Props. Übungen aus dem Skript als <Exercise> mit Frage, Optionen und Musterlösung; eigene Wissensabfragen nur in questions.js beziehungsweise exams.js. Keine Click-Walls. Integriere nur bei ausdrücklichem Auftrag.
Prüfe Vollständigkeit, IDs, Anker, Lint und Build; vergleiche jede Abbildung gerendert neben ihrer Folie (Desktop hell, Mobil dunkel). Berichte das Abbildungsinventar, abgeleitete Werte und benannte Quellfehler. Keine externen oder erfundenen Inhalte.
'''
